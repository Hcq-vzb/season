[build]
  publish = "."

# API
[[redirects]]
  from = "/api/send-inquiry"
  to = "/.netlify/functions/send-inquiry"
  status = 200

# Canonical host: non-www HTTPS
[[redirects]]
  from = "https://www.seasoningpackagingmachinery.com/*"
  to = "https://seasoningpackagingmachinery.com/:splat"
  status = 301
  force = true

# Legacy domain → new domain
[[redirects]]
  from = "https://www.npackpm.com/*"
  to = "https://seasoningpackagingmachinery.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://npackpm.com/*"
  to = "https://seasoningpackagingmachinery.com/:splat"
  status = 301
  force = true

# Under construction: keep robots.txt reachable
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# Under construction: every other URL serves the single page (200 rewrite, no loop)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
